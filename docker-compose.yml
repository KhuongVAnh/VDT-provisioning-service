services:
  # 1. Redis Cache & Pub/Sub Message Broker (Lắng nghe nội bộ 127.0.0.1)
  redis:
    image: redis:7.4-alpine
    container_name: drone-redis
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--port", "6380", "--bind", "127.0.0.1"]

  # 2. Go MAVLink Ingestion Service - GCS Router Mode
  telemetry-ingestion:
    build:
      context: ./telemetry-ingestion-service
      dockerfile: Dockerfile
    container_name: drone-telemetry-ingestion
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - redis
    env_file:
      - path: ./.env
        required: false
      - path: ./telemetry-ingestion-service/.env
        required: false
    environment:
      - UDP_LISTEN_ADDR=${UDP_LISTEN_ADDR:-0.0.0.0:14551}
      - TCP_GCS_PORT=${TCP_GCS_PORT:-10002}
      - REDIS_ADDR=${REDIS_ADDR:-127.0.0.1:6380}
      - REDIS_DB=${REDIS_DB:-0}
      - STATE_TTL_SECONDS=${STATE_TTL_SECONDS:-30}
      - PUBLISH_INTERVAL_MS=${PUBLISH_INTERVAL_MS:-100}
      - VPN_SUBNET_PREFIX=${VPN_SUBNET_PREFIX:-10.13.37.}

  # 3. NestJS API Gateway, Provisioning & Mission Control Dashboard
  provisioning-api:
    build:
      context: ./provisioning-api
      dockerfile: Dockerfile
    container_name: drone-provisioning-api
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      - redis
    volumes:
      - ./data/db:/data
      - /lib/modules:/lib/modules:ro
    env_file:
      - path: ./.env
        required: false
      - path: ./provisioning-api/.env
        required: false

  # 4. MediaMTX Video Streaming Server (Được triển khai thủ công qua Native Systemd Service trên VPS)
  # Chi tiết các bước cài đặt thủ công & hủy bỏ xem tại: huong_dan_cai_dat_mediamtx_manual.md
  # MediaMTX chỉ lắng nghe nội bộ tại 10.13.37.1:8554 (từ Drone) và 127.0.0.1 (NestJS Video Gateway).
  # ĐÓNG HOÀN TOÀN các cổng 10001 và 10005 ra Internet - Toàn bộ video đi qua Port 10004 của NestJS.
  # 
  # (Tùy chọn: Nếu muốn chạy qua Docker nội bộ thay vì Systemd, mở comment bên dưới):
  # media-server:
