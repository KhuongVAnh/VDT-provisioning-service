services:
  # 1. Redis Cache & Pub/Sub Message Broker
  redis:
    image: redis:7.4-alpine
    container_name: drone-redis
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]

  # 2. Go MAVLink Ingestion Service - GCS Router Mode
  # Thay thế hoàn toàn mavlink-routerd:
  #   - Lắng nghe trực tiếp từ Drone tại 10.13.37.1:14550 (bảo toàn IP nguồn 10.13.37.X)
  #   - Phục vụ QGroundControl / Mission Planner qua TCP 10002
  telemetry-ingestion:
    build:
      context: ./telemetry-ingestion-service
      dockerfile: Dockerfile
    container_name: drone-telemetry-ingestion
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - redis
    environment:
      # Drone gửi MAVLink thẳng lên VPS_PUBLIC_IP:14551
      # Vì qua WireGuard VPN, gói UDP mang đúng IP nguồn 10.13.37.X của Drone
      - UDP_LISTEN_ADDR=0.0.0.0:14551
      # Cổng TCP cho QGroundControl / Mission Planner kết nối vào
      - TCP_GCS_PORT=10002
      - REDIS_ADDR=127.0.0.1:6380
      - REDIS_DB=0
      - STATE_TTL_SECONDS=30
      - PUBLISH_INTERVAL_MS=100

  # 3. NestJS API Gateway, Provisioning & Mission Control Dashboard
  provisioning-api:
    build:
      context: ./provisioning-api
      dockerfile: Dockerfile
    container_name: drone-provisioning-api
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      - redis
    volumes:
      - ./data/db:/data
      - /lib/modules:/lib/modules:ro
    # Đọc bảo mật toàn bộ Secret Token, Key từ file .env
    env_file:
      - ./provisioning-api/.env
