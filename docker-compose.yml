services:
  # 1. Redis Cache & Pub/Sub Message Broker (Lắng nghe nội bộ 127.0.0.1)
  redis:
    image: redis:7.4-alpine
    container_name: drone-redis
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--port", "6380", "--bind", "127.0.0.1"]

  # 2. Go MAVLink Ingestion Service - GCS Router Mode
  telemetry-ingestion:
    build:
      context: ./telemetry-ingestion-service
      dockerfile: Dockerfile
    container_name: drone-telemetry-ingestion
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - redis
    env_file:
      - path: ./.env
        required: false
      - path: ./telemetry-ingestion-service/.env
        required: false
    environment:
      - UDP_LISTEN_ADDR=${UDP_LISTEN_ADDR:-0.0.0.0:14551}
      - TCP_GCS_PORT=${TCP_GCS_PORT:-10002}
      - REDIS_ADDR=${REDIS_ADDR:-127.0.0.1:6380}
      - REDIS_DB=${REDIS_DB:-0}
      - STATE_TTL_SECONDS=${STATE_TTL_SECONDS:-30}
      - PUBLISH_INTERVAL_MS=${PUBLISH_INTERVAL_MS:-100}
      - VPN_SUBNET_PREFIX=${VPN_SUBNET_PREFIX:-10.13.37.}

  # 3. NestJS API Gateway, Provisioning & Mission Control Dashboard
  provisioning-api:
    build:
      context: ./provisioning-api
      dockerfile: Dockerfile
    container_name: drone-provisioning-api
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      - redis
    volumes:
      - ./data/db:/data
      - /lib/modules:/lib/modules:ro
    env_file:
      - path: ./.env
        required: false
      - path: ./provisioning-api/.env
        required: false

  # 4. Ultra-Low Latency Video Streaming Server (MediaMTX)
  media-server:
    image: bluenviron/mediamtx:latest
    container_name: drone-media-server
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MTX_PROTOCOLS=tcp,udp
      # IP Public để WebRTC STUN/ICE kết nối tới trình duyệt Web
      - MTX_WEBRTCADDITIONALHOSTS=${VPS_PUBLIC_IP:-127.0.0.1}
      # RTSP nhận luồng từ Drone
      - MTX_RTSPADDRESS=${MTX_RTSP_ADDR:-:8554}
      # Cổng 1: Bắt tay WebRTC WHEP qua TCP 10001
      - MTX_WEBRTCADDRESS=${MTX_WEBRTC_ADDR:-:10001}
      # (Tùy chọn tương lai khi VPS mở được cổng UDP): Mở cổng UDP để WebRTC đạt độ trễ siêu thấp < 150ms
      # - MTX_WEBRTCICEUDPMUXADDRESS=:8189
      # Cổng 2: Bơm hình ảnh WebRTC qua TCP 10005 (100% TCP, KHÔNG CẦN UDP)
      - MTX_WEBRTCICETCPMUXADDRESS=:10005
      - MTX_HLSADDRESS=:8888
      - MTX_API=yes
      - MTX_APIADDRESS=127.0.0.1:9997
    env_file:
      - path: ./.env
        required: false
